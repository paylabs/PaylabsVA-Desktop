name: Build & Release Multiplatform

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            artifact_name: 'PaylabsVA-macOS-Universal'
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'PaylabsVA-Windows-x64'
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS compilation targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Paylabs VA v__VERSION__'
          tauriScript: npx tauri
          releaseBody: |
            ### 🚀 Paylabs VA Desktop v__VERSION__ (Multiplatform Release)
            
            Rilis resmi aplikasi desktop **Paylabs SNAP Virtual Account v4.8.1**:
            
            #### ✨ Fitur Baru & Peningkatan (v__VERSION__):
            - **🔄 In-App Auto-Update (GitHub Releases)**:
              - Pemeriksaan otomatis versi baru saat aplikasi dibuka (*silent check*).
              - Notifikasi Apple HIG Banner di pojok kanan atas dengan *progress bar* unduhan real-time.
              - Verifikasi keamanan tanda tangan kriptografis Ed25519 (anti-tampering).
              - Tombol manual *"Periksa Pembaruan"* di modal Pengaturan.
            - **🏦 Dukungan 14 Bank Channel (Dynamic VA)**:
              - BCA, BNI, BRI, BSI, CIMB Niaga, Danamon, Bank INA, Permata, Mandiri, Maybank, Muamalat, Sinarmas, BNC (*Bank Neo Commerce*), dan Nobu.
            - **🔒 Eksklusif 5 Bank Channel (Static VA)**:
              - BNI (`StaticBNIVA`), BNC (`StaticBNCVA`), Nobu (`StaticNobuVA`), Bank INA (`StaticINAVA`), dan BCA (`StaticBCAVA`).
            - **🛠️ Penyempurnaan & Stabilitas**:
              - Normalisasi pintar nama bank untuk Bank INA, BNC, dan Nobu.
              - Penanganan koneksi jaringan & error handling yang lebih andal.
            
            #### 📦 Paket Installer:
            - **macOS (Universal Binary)**: Installer `.dmg` untuk Mac Apple Silicon (M1-M4) & Intel.
            - **Windows (x64)**: Installer `.exe` (NSIS setup) & `.msi` (Windows Installer).
            
            #### 💡 Panduan Pengguna Mac:
            Jika muncul peringatan Gatekeeper *"App is damaged"*, buka Terminal di Mac dan ketik:
            ```bash
            sudo xattr -cr "/Applications/Paylabs VA.app"
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
